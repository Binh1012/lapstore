<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lapstore - PC Lắp ráp</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <main id="top">
      <section class="banner-section">
        <div class="banner">
          <img src="assets/img/banner-1.png" alt="Đại tiệc BUILD PC" />
        </div>
        <div class="banner banner-slider">
          <div class="slider-track">
            <div class="banner-slide">
              <img src="assets/img/banner-2a.png" alt="PC văn phòng học tập - phần 1" />
            </div>
            <div class="banner-slide">
              <img src="assets/img/banner-2b.png" alt="PC văn phòng học tập - phần 2" />
            </div>
          </div>
          <p class="banner-rule">Thể lệ chương trình</p>
          <div class="banner-small" id="banner-3-trigger" role="button" tabindex="0" aria-label="Mở thể lệ chương trình">
            <img src="assets/img/banner-3.png" alt="Banner 3" />
          </div>
        </div>
      </section>

      <div id="product-sections"></div>
    </main>

    <footer class="footer">
      <p>&nbsp;</p>
    </footer>

    <div id="rule-modal" class="modal-overlay hidden" aria-hidden="true">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="rule-modal-title">
        <button type="button" class="modal-close" aria-label="Đóng cửa sổ">×</button>
        <h2 id="rule-modal-title">Thể lệ chương trình</h2>
        <div class="modal-body">
          <p>&nbsp;</p>
        </div>
      </div>
    </div>

    <script src="assets/js/app.js"></script>
  </body>
</html>
