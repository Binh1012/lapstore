<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lapstore - Máy Tính Lắp Ráp & Linh Kiện Chính Hãng</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <!-- Header động nhận dữ liệu từ file header.html -->
    <div id="site-header"></div>

    <main id="top">
      <!-- KHỐI ĐẾM NGƯỢC FLASH SALE TỔNG THỂ -->
      <section class="countdown-section">
        <span class="countdown-badge">● FLASH SALE </span>
        <h2 class="countdown-title">Thời gian ưu đãi còn lại</h2>

        <div class="countdown-boxes">
          <div class="countdown-box">
            <span class="countdown-number" id="cd-days">00</span>
            <span class="countdown-label">NGÀY</span>
          </div>
          <span class="countdown-sep">:</span>
          <div class="countdown-box">
            <span class="countdown-number" id="cd-hours">00</span>
            <span class="countdown-label">GIỜ</span>
          </div>
          <span class="countdown-sep">:</span>
          <div class="countdown-box">
            <span class="countdown-number" id="cd-minutes">00</span>
            <span class="countdown-label">PHÚT</span>
          </div>
          <span class="countdown-sep">:</span>
          <div class="countdown-box">
            <span class="countdown-number" id="cd-seconds">00</span>
            <span class="countdown-label">GIÂY</span>
          </div>
        </div>
        <p class="countdown-end-text">Chương trình kết thúc lúc: <strong id="cd-end-label"></strong></p>
      </section>

      <!-- KHỐI SẢN PHẨM FLASH SALE (AUTOMATIC CAROUSEL) -->
      <section class="flashsale-section">
        <div id="flashsale-grid" class="flashsale-grid"></div>
      </section>

      <!-- BANNER CHUYỂN NHANH ĐẾN CÁC PHÂN KHÚC GIÁ -->
      <section class="segment-section">
        <div class="segment-banners">
          <div class="segment-banner-block">
            <a class="segment-banner-link" href="#segment-office" title="Xem phân khúc văn phòng">
              <img src="assets/img/banner-khoidau.png" alt="Phân khúc khởi đầu" />
            </a>
          </div>
          <div class="segment-banner-block">
            <a class="segment-banner-link" href="#segment-design" title="Xem phân khúc chuyên nghiệp">
              <img src="assets/img/banner-chuyennghiep.png" alt="Phân khúc chuyên nghiệp" />
            </a>
          </div>
          <div class="segment-banner-block">
            <a class="segment-banner-link" href="#segment-hiend" title="Xem phân khúc hi-end">
              <img src="assets/img/banner-hiend.png" alt="Phân khúc hi-end" />
            </a>
          </div>
        </div>
      </section>

      <!-- KHU VỰC CHỨA CÁC PHÂN KHÚC DO JAVASCRIPT TỰ ĐỘNG RENDER -->
      <div id="product-sections"></div>
    </main>

    <footer class="footer">
      <p>© 2026 Lapstore. Tất cả quyền lợi được bảo lưu.</p>
    </footer>

    <script src="assets/js/app.js"></script>
  </body>
</html>
